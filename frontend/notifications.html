<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuxCart - Notifications Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

    <div class="store-container">

        <!-- Shared Desktop Navbar Navigation Header Header -->
        <header class="top-header">
            <a href="dashboard.html" class="web-brand">LuxCart</a>
            <div class="search-bar-container">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search for notifications..." aria-label="Search">
            </div>
            <nav class="desktop-nav-links">
                <a href="dashboard.html" class="web-nav-item"><i class="fa-solid fa-house"></i> Home</a>
                <a href="categories.html" class="web-nav-item"><i class="fa-solid fa-table-cells-large"></i> Categories</a>
                <a href="notifications.html" class="web-nav-item active"><i class="fa-solid fa-bell"></i> Notifications</a>
                <a href="account.html" class="web-nav-item"><i class="fa-solid fa-circle-user"></i> Account</a>
                <a href="cart.html" class="web-nav-item"><i class="fa-solid fa-cart-shopping"></i> Cart</a>
            </nav>
        </header>

        <!-- Main Inbox Area Feed Wrapper Layout Container -->
        <!-- Main Inbox Area Feed Wrapper Layout Container -->
<main class="notifications-wrapper">

    <h2 class="section-headline" style="border:none; margin-bottom:0;">Inbox Notifications</h2>

    <!-- Toggle Filter Pills Row Component -->
    <div class="filter-pills-row">
        <span class="capsule-pill pill-active">All Updates</span>
        <span class="capsule-pill pill-inactive"><i class="fa-solid fa-tags"></i> Exclusive Offers</span>
    </div>

    <!-- ADDED ID HERE SO JAVASCRIPT CAN TARGET IT -->
    <div id="notificationsContainer" class="notifications-cards-grid">
        <!-- JavaScript will dynamically inject your cart notifications here -->
    </div>

</main>


        <!-- Global Base Widescreen Web Footer -->
        <footer class="web-footer">

        </footer>

    </div>
