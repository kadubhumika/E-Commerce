<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuxCart - Edit Profile</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

    <div class="store-container">

        <!-- Shared Widescreen Top Header Navbar -->
        <header class="top-header">
            <a href="dashboard.html" class="web-brand">LuxCart</a>
            <div class="search-bar-container">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search for items, choices..." aria-label="Search">
            </div>
            <nav class="desktop-nav-links">
                <a href="dashboard.html" class="web-nav-item"><i class="fa-solid fa-house"></i> Home</a>
                <a href="categories.html" class="web-nav-item"><i class="fa-solid fa-table-cells-large"></i> Categories</a>
                <a href="notifications.html" class="web-nav-item"><i class="fa-solid fa-bell"></i> Notifications</a>
                <a href="account.html" class="web-nav-item active"><i class="fa-solid fa-circle-user"></i> Account</a>
                <a href="cart.html" class="web-nav-item"><i class="fa-solid fa-cart-shopping"></i> Cart</a>
            </nav>
        </header>

        <!-- Main Edit Workspace Container -->
        <main class="profile-edit-wrapper">

            <h2 class="section-headline" style="border:none; margin-bottom:10px;">Edit Personal Information</h2>

            <div class="profile-card-container">
                <form>

                    <!-- Name Row Split Fields (Incorporating Your Specific Input Identifiers) -->
                    <div class="form-row-split">
                        <div class="input-block">
                            <label for="firstName" style="color: var(--text-muted); display:block; margin-bottom:8px; font-size:0.9rem;">First Name</label>
                            <input id="firstName" type="text" class="dark-input-field" value="Tharun" required>
                        </div>
                        <div class="input-block">
                            <label for="lastName" style="color: var(--text-muted); display:block; margin-bottom:8px; font-size:0.9rem;">Last Name</label>
                            <input id="lastName" type="text" class="dark-input-field" value="Kiruthik" required>
                        </div>
                    </div>

                    <!-- Gender Selection Segment Section -->
                    <div class="input-block" style="margin-bottom: 25px;">
                        <label style="color: var(--text-muted); font-size:0.9rem;">Your Gender</label>
                        <div class="gender-select-container">
                            <label class="gender-radio-label">
                                <input type="radio" name="user-gender" value="male" checked> Male
                            </label>
                            <label class="gender-radio-label">
                                <input type="radio" name="user-gender" value="female"> Female
                            </label>
                        </div>
                    </div>

                    <!-- Contact Details Form Data Row (Incorporating Your Specific Input Identifiers) -->
                    <div class="form-row-split">

                        <div class="input-block">
                            <label for="phone" style="color: var(--text-muted); display:block; margin-bottom:8px; font-size:0.9rem;">Mobile Number</label>
                            <input id="phone" type="tel" class="dark-input-field" value="+91 9876543210" required>
                        </div>
                    </div>

                    <!-- Submission Action Button Footer Trigger (Incorporating Your Button Identifier) -->
                    <div style="margin-top: 30px; text-align: right;">
                        <button id="saveBtn" type="button" class="save-profile-btn">

                            Save Changes
                        </button>
                    </div>

                </form>
            </div>

        </main>

        <!-- Global Base Widescreen Web Footer -->
        <footer class="web-footer">
            <p>&copy; 2026 LuxCart Marketplace Inc. All rights reserved.</p>
        </footer>

    </div>
<script src="js/api.js"></script>
<script src="js/edit_profile.js"></script>
<script src="js/notifications.js"></script>


</body>
</html>
